<html>
    <head>
        <script>
            function loadData(){
                var xhr = new XMLHttpRequest();
                xhr.onreadystatechange = function(){
                    document.getElementById("rd").innerHTML=this.readyState;
                    
                    if(this.readyState == 4 && this.status==200){
                        var response = this.responseText;
                        var arr = JSON.parse(response);
                        var output="";
                        for(i=0;i<arr.length;i++){
                            var obj = arr[i];
                            var row="<tr><td>"+obj.Id + "</td><td>"+
                                               obj.Name + "</td><td>"+
                                               obj.Address + "</td></tr>";
                            output+=row;
                        }
                        document.getElementById("tBody").innerHTML = output;
                        
                    }

                };
                xhr.open("GET","https://localhost:44368/api/student/all",true);
                xhr.send();

            }
        </script>
    </head>
    <body>
        <button onclick="loadData()">Load Data</button>
        <span id="rd"></span>
        <table border="1">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Address</th>
                </tr>
            </thead>
            <tbody id="tBody">

            </tbody>
        </table>
    </body>
</html>
